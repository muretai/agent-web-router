<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img">
  <title>Help your agent behave on the site it visits.</title>
  <rect width="740" height="300" fill="#fafafa"/>
  <text x="24" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666">Card, WebMCP and MCP are different jobs. They coexist. They are not three substitutes.</text>
  <rect x="20" y="40" width="700" height="168" rx="10" fill="#fff" stroke="#111"/>
  <text x="370" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#111">Help your agent behave on the site it visits</text>
  <text x="370" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#555">Find the door. Check it is theirs. Take the one that fits this visit.</text>
  <text x="370" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111">Agent Card - agent-native</text>
  <text x="370" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111">WebMCP - person, existing page</text>
  <text x="370" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111">MCP server - tool account, other job</text>
  <text x="370" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111">Do not follow a pointer to someone else's door.</text>
  <text x="370" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111">or exit 2</text>
</svg>
